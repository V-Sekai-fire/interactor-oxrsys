# SPDX-License-Identifier: MPL-2.0
#
# Builds the Linux runtime with its PyroWave encoder and the PyroWave round trip test,
# checks the runtime links no FFmpeg library, and packages it as .deb and .rpm with fpm.
name: linux-runtime

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: linux-runtime-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ninja-build pkg-config \
            libvulkan-dev uuid-dev libx11-dev libx11-xcb-dev libxcb1-dev libxrandr-dev patchelf
      - name: Configure
        run: cmake --preset linux-native -DOXRSYS_BUILD_QT_FRONTENDS=OFF
      - name: Build
        run: cmake --build build/linux-native --target oxrsys_runtime oxrsys_pyrowave_tests
      - name: PyroWave round trip, unchecked without a GPU
        run: echo "UNCHECKED 1 - oxrsys_pyrowave_tests needs a Vulkan GPU, which this runner lacks, and PyroWave refuses software rasterizers; it runs on the Windows desk"
      - name: No FFmpeg in the runtime
        run: scripts/linux_check_runtime_linkage.sh build/linux-native/runtime/liboxrsys-runtime.so --self-test
      - name: Packaging tools
        run: |
          sudo apt-get install -y -q --no-install-recommends ruby ruby-dev rpm
          sudo gem install --no-document fpm -v 1.18.0
      - name: Package the runtime (.deb, .rpm)
        run: scripts/linux_package_runtime.sh build/linux-native/runtime/liboxrsys-runtime.so packages
      - name: Check the packages
        run: for p in packages/*.deb packages/*.rpm; do scripts/linux_package_runtime.sh --check "$p"; done
      - name: Check control, a package without its manifest fails
        run: |
          mkdir -p control/opt/oxrsys/lib
          cp build/linux-native/runtime/liboxrsys-runtime.so control/opt/oxrsys/lib/
          fpm -s dir -t deb -C control -p control.deb -n oxrsys-control -v 0 opt
          if scripts/linux_package_runtime.sh --check control.deb; then echo "control passed but must fail"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: oxrsys-runtime-linux-packages
          path: packages/

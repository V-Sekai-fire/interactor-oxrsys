# SPDX-License-Identifier: MPL-2.0
#
# Builds the Linux runtime with its PyroWave encoder and the PyroWave round trip test,
# and checks the runtime links no FFmpeg library.
name: linux-runtime

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: linux-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ninja-build pkg-config \
            libvulkan-dev uuid-dev libx11-dev libx11-xcb-dev libxcb1-dev libxrandr-dev patchelf
      - name: Configure
        run: cmake --preset linux-native -DOXRSYS_BUILD_QT_FRONTENDS=OFF
      - name: Build
        run: cmake --build build/linux-native --target oxrsys_runtime oxrsys_pyrowave_tests
      - name: PyroWave round trip, unchecked without a GPU
        run: echo "UNCHECKED 1 - oxrsys_pyrowave_tests needs a Vulkan GPU, which this runner lacks, and PyroWave refuses software rasterizers; it runs on the Windows desk"
      - name: No FFmpeg in the runtime
        run: scripts/linux_check_runtime_linkage.sh build/linux-native/runtime/liboxrsys-runtime.so --self-test
